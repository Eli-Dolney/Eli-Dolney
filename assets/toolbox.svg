<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
  <title id="title">Eli's toolbox</title>
  <desc id="desc">Unreal Engine, C++, Roblox, Luau, Minecraft, Java, Python, TypeScript, JavaScript, Vue, Svelte, and Git.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220" /><stop offset="1" stop-color="#17102a" /></linearGradient>
    <linearGradient id="line"><stop stop-color="#00e5ff" /><stop offset=".5" stop-color="#7c3aed" /><stop offset="1" stop-color="#ff2e88" /></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .chip { animation: breathe 4s ease-in-out infinite; }
    .chip:nth-of-type(2n) { animation-delay: 1s; }
    .chip:nth-of-type(3n) { animation-delay: 2s; }
    @keyframes breathe { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
  </style>
  <rect width="900" height="190" rx="20" fill="url(#bg)" />
  <rect x="1" y="1" width="898" height="188" rx="19" fill="none" stroke="#334155" />
  <text x="450" y="33" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="800" letter-spacing="4">CURRENT TOOLBOX</text>
  <rect x="345" y="43" width="210" height="2" rx="1" fill="url(#line)" filter="url(#glow)" />
  <g font-size="14" font-weight="700" text-anchor="middle">
    <g class="chip" transform="translate(40 62)"><rect width="130" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="19" cy="19" r="5" fill="#f8fafc" /><text x="76" y="24" fill="#e2e8f0">Unreal Engine</text></g>
    <g class="chip" transform="translate(180 62)"><rect width="82" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="18" cy="19" r="5" fill="#659ad2" /><text x="53" y="24" fill="#e2e8f0">C++</text></g>
    <g class="chip" transform="translate(272 62)"><rect width="100" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="18" cy="19" r="5" fill="#e2231a" /><text x="61" y="24" fill="#e2e8f0">Roblox</text></g>
    <g class="chip" transform="translate(382 62)"><rect width="88" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="18" cy="19" r="5" fill="#00a2ff" /><text x="55" y="24" fill="#e2e8f0">Luau</text></g>
    <g class="chip" transform="translate(480 62)"><rect width="116" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="18" cy="19" r="5" fill="#62b47a" /><text x="69" y="24" fill="#e2e8f0">Minecraft</text></g>
    <g class="chip" transform="translate(606 62)"><rect width="86" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="18" cy="19" r="5" fill="#e76f00" /><text x="54" y="24" fill="#e2e8f0">Java</text></g>
    <g class="chip" transform="translate(702 62)"><rect width="112" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="18" cy="19" r="5" fill="#3776ab" /><text x="66" y="24" fill="#e2e8f0">Python</text></g>
    <g class="chip" transform="translate(105 116)"><rect width="130" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="18" cy="19" r="5" fill="#3178c6" /><text x="75" y="24" fill="#e2e8f0">TypeScript</text></g>
    <g class="chip" transform="translate(245 116)"><rect width="132" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="18" cy="19" r="5" fill="#f7df1e" /><text x="76" y="24" fill="#e2e8f0">JavaScript</text></g>
    <g class="chip" transform="translate(387 116)"><rect width="82" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="18" cy="19" r="5" fill="#42b883" /><text x="53" y="24" fill="#e2e8f0">Vue</text></g>
    <g class="chip" transform="translate(479 116)"><rect width="100" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="18" cy="19" r="5" fill="#ff3e00" /><text x="61" y="24" fill="#e2e8f0">Svelte</text></g>
    <g class="chip" transform="translate(589 116)"><rect width="82" height="38" rx="19" fill="#1e293b" stroke="#64748b" /><circle cx="18" cy="19" r="5" fill="#f05032" /><text x="52" y="24" fill="#e2e8f0">Git</text></g>
  </g>
</svg>
