<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Eli Dolney</title>
  <desc id="desc">Eli Dolney.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f" />
      <stop offset="0.52" stop-color="#111827" />
      <stop offset="1" stop-color="#170d2d" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" />
      <stop offset="0.5" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#ff2e88" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".34" />
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9fb4d0" stroke-opacity=".07" />
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="frame"><rect width="900" height="250" rx="24" /></clipPath>
  </defs>
  <style>
    .orb-a { animation: driftA 8s ease-in-out infinite alternate; }
    .orb-b { animation: driftB 10s ease-in-out infinite alternate; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .scan { animation: scan 5.5s linear infinite; }
    .spark { animation: spark 2.4s ease-in-out infinite; }
    .spark:nth-of-type(2) { animation-delay: .8s; }
    .spark:nth-of-type(3) { animation-delay: 1.6s; }
    @keyframes driftA { to { transform: translate(65px, 18px) scale(1.08); } }
    @keyframes driftB { to { transform: translate(-55px, -22px) scale(.92); } }
    @keyframes pulse { 50% { opacity: .55; transform: scale(.97); } }
    @keyframes scan { from { transform: translateX(-980px); } to { transform: translateX(980px); } }
    @keyframes spark { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <g clip-path="url(#frame)">
    <rect width="900" height="250" fill="url(#bg)" />
    <rect width="900" height="250" fill="url(#grid)" />
    <circle class="orb-a" cx="75" cy="55" r="170" fill="url(#glow)" />
    <circle class="orb-b" cx="860" cy="245" r="220" fill="#7c3aed" fill-opacity=".12" />
    <path class="scan" d="M-80 0L20 0L-85 250L-185 250Z" fill="#ffffff" fill-opacity=".045" />
    <rect x="22" y="22" width="856" height="206" rx="17" fill="none" stroke="url(#accent)" stroke-opacity=".48" />
    <g opacity=".9">
      <circle class="spark" cx="54" cy="48" r="4" fill="#00e5ff" />
      <circle class="spark" cx="846" cy="48" r="4" fill="#7c3aed" />
      <circle class="spark" cx="846" cy="202" r="4" fill="#ff2e88" />
    </g>
    <text class="pulse" x="450" y="145" text-anchor="middle" fill="#f8fafc" font-size="64" font-weight="850" letter-spacing="4" filter="url(#softGlow)">ELI DOLNEY</text>
  </g>
</svg>
